<!DOCTYPE html>
<html>
<head>
    <title>Osaühingute otsing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Osaühingud</h1>
            <a href="{{ url_for('create_company') }}" class="btn btn-primary">Osaühingu asutamise vorm</a>
        </div>

        <form method="get" action="{{ url_for('home') }}" class="mb-3">
            <input type="text" name="q" class="form-control" placeholder="Otsi osaühinguid..." value="{{ query }}">
        </form>
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Osaühingu nimi</th>
                    <th>Registrikood</th>
                </tr>
            </thead>
            <tbody>
                {% for company in companies %}
                <tr onclick="window.location='{{ url_for('company_detail', company_id=company.id) }}'" style="cursor: pointer;">
                    <td>{{ company.name }}</td>
                    <td>{{ company.register_number }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="2">Osaühinguid ei leitud.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        
    </div>
</body>
</html>
